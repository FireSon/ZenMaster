; Zendure test device on an ESP32: BLE pairing like a real device, then MQTT as an ACE 1500.
; Pick the env that matches the chip. ESP32-C3 is the same family as the real zenSDK module.
; NOTE: an ESP32-S2 has NO Bluetooth and cannot run this.

[env]
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv  ; room for BLE + WiFi + web server; USB flash, no OTA needed
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DMQTT_VERSION=3  ; MQTT v3.1, like zendure_ha connects to the cloud broker
    -DARDUINO_USB_CDC_ON_BOOT=1  ; route Serial to the USB Serial/JTAG so the console/logging works over USB
    -DARDUINO_USB_MODE=1         ; C3 uses the built-in USB Serial/JTAG (HWCDC)

[env:esp32-c3]
platform = espressif32@^6.9.0
board = esp32-c3-devkitm-1

[env:esp32]
platform = espressif32@^6.9.0
board = esp32dev
